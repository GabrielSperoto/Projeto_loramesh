; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; [platformio]
; extra_configs = mock.ini

[env]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = arduino
build_flags = 
   -I include
   -DCORE_DEBUG_LEVEL=5
monitor_speed = 115200
lib_deps =  Wire @2.0.0
            SPI @2.0.0
            jgromes/RadioLib@^7.1.0

[env:endDevice]
build_src_filter = +<*> -<Router/*>

[env:router]
build_src_filter = +<*> -<EndDevice/*>
lib_deps =  ${env.lib_deps}
            links2004/WebSockets @ ^2.3.6
	         bblanchon/ArduinoJson@^7.4.2
            

[env:router_mockSend2Tcp]
extends = env:router
build_flags = -D MOCK_TEST_MODE -D MOCK_SEND_2_TCP
build_src_filter = +<*> -<EndDevice/*> - <Mock/EndDevice/*>

[env:router_mockSend2Lora]
extends = env:router
build_flags = -D MOCK_TEST_MODE -D MOCK_SEND_2_LORA
build_src_filter = +<*> -<EndDevice/*> - <Mock/EndDevice/*>