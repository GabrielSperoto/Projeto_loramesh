[env:router_mockSend2Tcp]
extends = env:router
build_flags = -D MOCK_ROUTER_TEST_MODE -D MOCK_SEND_2_TCP
build_src_filter = +<*> -<EndDevice/*> - <Mock/EndDevice/*>

